<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.6"/>

  <!-- Outer Update Arc 1 -->
  <path d="M 64 26 A 38 38 0 0 1 102 64" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="102,52 108,66 94,66" fill="#38bdf8" transform="rotate(35 102 64)"/>

  <!-- Outer Update Arc 2 -->
  <path d="M 64 102 A 38 38 0 0 1 26 64" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="26,76 20,62 34,62" fill="#2563eb" transform="rotate(35 26 64)"/>

  <!-- Center Arrow Up -->
  <path d="M 64 42 L 80 58 L 71 58 L 71 78 L 57 78 L 57 58 L 48 58 Z" fill="url(#arrowGrad)"/>

  <!-- Base Platform / Foundation Line -->
  <rect x="44" y="84" width="40" height="5" rx="2.5" fill="#38bdf8" opacity="0.8"/>
</svg>
