<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root user can own the service -->
  <policy user="root">
    <allow own="org.linuxupdatetool.Daemon1"/>
    <allow send_destination="org.linuxupdatetool.Daemon1"/>
  </policy>

  <!-- Any session user can send method calls to the service -->
  <policy context="default">
    <allow send_destination="org.linuxupdatetool.Daemon1"/>
    <allow receive_sender="org.linuxupdatetool.Daemon1"/>
  </policy>
</busconfig>
